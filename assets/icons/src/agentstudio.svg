<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- AI 개발 스튜디오: 코드 창 + 에이전트 반짝임. CI #2563EB→#8B5CF6 -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#4F5BF0"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="hl" cx=".28" cy=".12" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1FF"/></linearGradient>
  <linearGradient id="code" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1E1B6B" flood-opacity=".35"/></filter>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fff" flood-opacity=".7"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#hl)"/>
<g filter="url(#sh)">
  <rect x="200" y="268" width="624" height="512" rx="72" fill="url(#win)"/>
</g>
<!-- 창 상단 점 -->
<circle cx="268" cy="334" r="15" fill="#C7CEF5"/><circle cx="316" cy="334" r="15" fill="#C7CEF5"/><circle cx="364" cy="334" r="15" fill="#C7CEF5"/>
<line x1="200" y1="388" x2="824" y2="388" stroke="#DDE2FA" stroke-width="4"/>
<!-- </> -->
<g fill="none" stroke="url(#code)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="408,498 330,580 408,662"/>
  <polyline points="616,498 694,580 616,662"/>
  <line x1="548" y1="478" x2="476" y2="682"/>
</g>
<!-- 에이전트 반짝임 -->
<g filter="url(#gl)" fill="#fff">
  <path d="M780 150 C792 214 814 236 878 248 C814 260 792 282 780 346 C768 282 746 260 682 248 C746 236 768 214 780 150 Z"/>
  <path d="M890 330 C895 356 904 365 930 370 C904 375 895 384 890 410 C885 384 876 375 850 370 C876 365 885 356 890 330 Z"/>
</g>
</svg>
