<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 파비콘 — 회사 CI 심벌(C). SVG 우선, PNG 는 대체용 -->
    <link rel="icon" href="assets/brand/symbol.svg" type="image/svg+xml">
    <link rel="icon" href="assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" sizes="180x180">
    <meta name="description" content="필요한 것만 남긴 화면, 기기 안에서 움직이는 지능. CreativeLab의 제품과 비전.">
    <meta name="keywords" content="AI, 플랫폼, 핀테크, 블록체인, 보안, 양자보안, 모바일 앱, 포트폴리오">
    <meta name="author" content="CreativeLab">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CreativeLab">
    <meta property="og:description" content="필요한 것만 남긴 화면, 기기 안에서 움직이는 지능.">
    <meta property="og:url" content="https://creativelabai.kr/">
    <meta property="og:image" content="https://creativelabai.kr/assets/brand/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <title>CreativeLab</title>

    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 워드마크 글꼴 — Montserrat(OFL), 로고 글자만 담은 부분 글꼴을 자체 호스팅(각 2KB) -->
    <link rel="preload" href="assets/brand/fonts/montserrat-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/brand/fonts/montserrat-300.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <a href="#main" class="skip-link" data-i18n="skip">본문으로 건너뛰기</a>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- 회사 CI 로고 — 심벌(SVG) + 살아 있는 글자 워드마크 + 태그라인 -->
            <a href="#home" class="brand" id="logoLink" aria-label="CreativeLab 홈" data-i18n-attr="aria-label:brand_aria">
                <img class="brand-mark" src="assets/brand/symbol.svg" width="28" height="28" alt="">
                <span class="brand-word"><b>Creative</b>Lab</span>
                <span class="brand-tag">Ideas to Reality</span>
            </a>
            <ul class="nav-menu">
                <li><a href="#products" class="nav-link" data-i18n="nav_products">제품</a></li>
                <li><a href="#areas" class="nav-link" data-i18n="nav_areas">사업 영역</a></li>
                <li class="lang-item">
                    <label class="lang-switch">
                        <span class="sr-only" data-i18n="lang_label">언어</span>
                        <select id="langSelect" class="lang-select" aria-label="언어"></select>
                    </label>
                </li>
            </ul>
        </div>
    </nav>

    <main id="main">
        <!-- ==================== VIEW 1 : HOME ==================== -->
        <div class="view" id="viewHome">
            <!-- 첫 화면: 한 문장, 그리고 실제 앱 화면 세 장 -->
            <section id="home" class="hero">
                <div class="container hero-inner">
                    <p class="hero-eyebrow">Ideas to Reality</p>
                    <h1 class="hero-title">
                        <span data-i18n="hero_line1">작은 화면 안에,</span><br>
                        <span class="hero-accent" data-i18n="hero_line2">깊은 생각을.</span>
                    </h1>
                    <p class="hero-lede" data-i18n="hero_lede">필요한 것만 남긴 화면. 기기 안에서 움직이는 지능. 매일 손이 가는 것들을 새로 상상합니다.</p>
                    <div class="hero-actions">
                        <a href="#products" class="btn btn-primary" data-i18n="btn_products">제품 보기</a>
                        <a href="#areas" class="btn btn-ghost" data-i18n="btn_areas">사업 영역</a>
                    </div>
                </div>
                <!-- 출시한 앱 전부를 원통 모양으로 둘러 세운다. 좌우로 밀면 돌면서 앱이 하나씩 앞으로 온다.
                     사진은 main.js 가 projects.json 의 shot(없으면 아이콘)으로 채운다. -->
                <div class="ring" id="heroRing" role="region" aria-roledescription="회전 캐러셀" aria-label="모든 제품" data-i18n-attr="aria-roledescription:ring_region;aria-label:ring_region_label">
                    <div class="ring-viewport" id="ringViewport" tabindex="0" aria-label="좌우 방향키로 돌려 보세요" data-i18n-attr="aria-label:ring_viewport">
                        <div class="ring-track" id="ringTrack"></div>
                    </div>
                    <div class="ring-caption" id="ringCaption" aria-live="polite"></div>
                    <div class="ring-controls">
                        <button class="ring-btn" id="ringPrev" type="button" aria-label="이전 앱" data-i18n-attr="aria-label:ring_prev">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button class="ring-btn" id="ringNext" type="button" aria-label="다음 앱" data-i18n-attr="aria-label:ring_next">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 대표 제품: 큰 타일 두 개 -->
            <section id="products" class="products" aria-label="대표 제품" data-i18n-attr="aria-label:featured_label">
                <div id="featureTiles"></div>
            </section>

            <!-- 나머지 제품: 좌우로 넘기는 캐러셀 -->
            <section id="lineup" class="lineup" aria-labelledby="lineupTitle">
                <div class="container">
                    <header class="lineup-head">
                        <h2 class="section-title" id="lineupTitle" data-i18n="lineup_title">모든 제품.</h2>
                        <p class="section-sub" data-i18n="lineup_sub">옆으로 넘기며 하나씩 만나 보세요.</p>
                    </header>
                </div>
                <div class="carousel" id="lineupCarousel"></div>
            </section>

            <!-- 사업 영역: 3D 이미지 타일 -->
            <section id="areas" class="section section-areas" aria-labelledby="areasTitle">
                <div class="container">
                    <header class="section-head">
                        <p class="section-eyebrow" data-i18n="areas_eyebrow">사업 영역</p>
                        <h2 class="section-title" id="areasTitle" data-i18n="areas_title">기술이 향하는 곳.</h2>
                    </header>
                </div>
                <!-- 영역 타일은 좌우로 넘기는 한 줄. main.js 가 categories.json 의 domain 으로 채운다. -->
                <div class="carousel carousel-areas" id="areaGrid"></div>
            </section>
        </div>

        <!-- ==================== VIEW 2 : CATEGORY ==================== -->
        <div class="view" id="viewCategory" hidden>
            <div class="container detail-container" id="categoryBody"></div>
        </div>

        <!-- ==================== VIEW 3 : PROJECT ==================== -->
        <div class="view" id="viewProject" hidden>
            <div class="container detail-container" id="projectBody"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p class="footer-text">&copy; 2026 CreativeLab</p>
            <!-- 연락은 조용한 링크 하나. 주소는 화면에 글자로 보이지 않고, main.js 가 실행 중에 href 만 채운다. -->
            <nav class="footer-links" aria-label="바깥 링크" data-i18n-attr="aria-label:footer_links_label">
                <a href="https://apps.apple.com/kr/developer/inphil-choi/id6785766361" target="_blank" rel="noopener noreferrer">App Store</a>
                <a href="https://inphilchoi.github.io/" target="_blank" rel="noopener noreferrer" data-i18n="footer_guide">앱 안내</a>
                <a id="contactLink" hidden data-i18n="footer_contact">문의</a>
            </nav>
            <nav class="footer-social" aria-label="SNS" data-i18n-attr="aria-label:footer_social_label">
                <a href="https://www.youtube.com/@creativelabai-kr" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg></a>
                <a href="https://www.instagram.com/creativelab.kr/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg></a>
                <a href="https://x.com/Creativelabchoi" target="_blank" rel="noopener noreferrer" aria-label="X" title="X"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4l16 16M20 4L4 20"/></svg></a>
                <!-- Facebook: 회사 페이지가 생기면 여기에 같은 형식의 <a> 한 줄을 추가한다(빈 링크 금지). -->
            </nav>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="scripts/main.js"></script>
</body>
</html>
